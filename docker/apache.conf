<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/pay/(.*)$ /pay.php?s=$1 [L,QSA]
    RewriteRule ^/api/(.*)$ /api.php?s=$1 [L,QSA]
    RewriteRule ^/doc/(.[a-zA-Z0-9\-\_]+).html$ /index.php?doc=$1 [L,QSA]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^/(.[a-zA-Z0-9\-\_]+).html$ /index.php?mod=$1 [L,QSA]

    <Directory /var/www/html/plugins>
        Require all denied
    </Directory>
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>
</VirtualHost>
